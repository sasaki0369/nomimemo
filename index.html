<style>
  :root{
    --paper: #EAE2CF;
    --paper-card: #F6F0E1;
    --ink: #2C3B4C;
    --ink-soft: #5B6B7A;
    --hanko: #B23A2E;
    --soy: #A97C36;
    --line: #C9BEA0;
    --done-bg: #DDD3B8;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(44,59,76,0.05) 1px, transparent 1.4px);
    background-size: 14px 14px;
    color: var(--ink);
    font-family: 'Zen Maru Gothic', sans-serif;
    min-height: 100vh;
    padding: 18px 14px 80px;
  }
  .wrap{ max-width: 480px; margin: 0 auto; }

  /* ---- header ticket ---- */
  .ticket{
    background: var(--paper-card);
    border: 2px solid var(--ink);
    border-radius: 4px;
    padding: 16px 18px 14px;
    position: relative;
    box-shadow: 3px 3px 0 rgba(44,59,76,0.15);
    margin-bottom: 16px;
  }
  .ticket::after{
    content:"";
    position:absolute; left:-8px; right:-8px; bottom:-10px; height:10px;
    background-image: radial-gradient(circle at 6px 0, transparent 6px, var(--paper) 6.5px);
    background-size: 12px 10px;
    background-repeat: repeat-x;
  }
  .ticket-title{
    font-family:'Shippori Mincho', serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:0.06em;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .ticket-title small{ font-family:'DotGothic16',sans-serif; font-size:12px; color:var(--ink-soft); font-weight:400; }
  .progress-row{ display:flex; align-items:center; gap:10px; margin-top:10px; }
  .progress-bar{ flex:1; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--hanko); transition: width .3s ease; }
  .progress-count{ font-family:'DotGothic16',sans-serif; font-size:14px; white-space:nowrap; color:var(--ink-soft); }

  /* ---- current target card ---- */
  .current-card{
    background: var(--paper-card);
    border: 2px solid var(--hanko);
    border-radius: 6px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 3px 3px 0 rgba(178,58,46,0.18);
    position:relative;
  }
  .current-label{
    font-family:'DotGothic16',sans-serif;
    font-size:12px; color:var(--hanko); letter-spacing:0.1em;
    display:flex; justify-content:space-between; align-items:center;
  }
  .mode-toggle{ display:flex; gap:6px; }
  .mode-btn{
    border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
    font-family:'DotGothic16',sans-serif; font-size:10px; padding:3px 7px; border-radius:12px; cursor:pointer;
  }
  .mode-btn.active{ background:var(--ink); color:var(--paper-card); border-color:var(--ink); }
  .current-main{ display:flex; align-items:center; gap:14px; margin:12px 0 16px; }
  .current-num{
    width:56px; height:56px; border-radius:50%;
    background:var(--ink); color:var(--paper-card);
    display:flex; align-items:center; justify-content:center;
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:24px;
    flex-shrink:0;
  }
  .current-name{ font-family:'Shippori Mincho',serif; font-weight:800; font-size:26px; }
  .current-sub{ font-family:'DotGothic16',sans-serif; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .btn-row{ display:flex; gap:10px; }
  .btn{
    flex:1; text-align:center; padding:14px 10px; border-radius:6px;
    font-family:'Zen Maru Gothic',sans-serif; font-weight:700; font-size:15px;
    border:2px solid var(--ink); cursor:pointer; text-decoration:none; display:block;
  }
  .btn-nav{ background:var(--ink); color:var(--paper-card); }
  .btn-done{ background:var(--hanko); color:#fff; border-color:var(--hanko); }
  .btn:active{ transform: translateY(1px); }

  .all-done{
    text-align:center; padding:30px 16px;
  }
  .all-done .stamp{
    display:inline-flex; align-items:center; justify-content:center;
    width:90px; height:90px; border-radius:50%;
    border:4px solid var(--hanko); color:var(--hanko);
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:15px;
    transform: rotate(-8deg);
    margin-bottom:12px;
  }
  .all-done p{ font-family:'DotGothic16',sans-serif; color:var(--ink-soft); font-size:13px; }

  /* ---- list ---- */
  .list-heading{
    font-family:'DotGothic16',sans-serif; font-size:12px; color:var(--ink-soft);
    letter-spacing:0.1em; margin: 4px 4px 8px;
  }
  .list{ display:flex; flex-direction:column; gap:8px; }
  .item{
    display:flex; align-items:center; gap:12px;
    background: var(--paper-card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    cursor:pointer;
  }
  .item.done{ background: var(--done-bg); border-color:var(--soy); opacity:0.85; }
  .item.current{ border:2px solid var(--hanko); }
  .item-num{
    width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    font-family:'Shippori Mincho',serif; font-weight:800; font-size:14px;
    background: var(--paper); border:1.5px solid var(--ink); color:var(--ink);
  }
  .item.done .item-num{ background:var(--soy); border-color:var(--soy); color:#fff; }
  .item.current .item-num{ background:var(--hanko); border-color:var(--hanko); color:#fff; }
  .item-body{ flex:1; min-width:0; }
  .item-name{ font-family:'Shippori Mincho',serif; font-weight:700; font-size:16px; }
  .item-status{ font-family:'DotGothic16',sans-serif; font-size:11px; color:var(--ink-soft); }
  .item.current .item-status{ color:var(--hanko); }
  .item-time{
    font-family:'DotGothic16',sans-serif; font-size:13px; font-weight:700;
    color:var(--soy); flex-shrink:0; text-align:right; white-space:nowrap;
  }

  /* ---- history ---- */
  .history-heading{
    font-family:'DotGothic16',sans-serif; font-size:12px; color:var(--ink-soft);
    letter-spacing:0.1em; margin: 22px 4px 8px;
  }
  .history-list{ display:flex; flex-direction:column; gap:8px; }
  .history-item{
    background: var(--paper-card); border:1px solid var(--line); border-radius:6px;
    padding:10px 12px; display:flex; justify-content:space-between; align-items:baseline;
    font-family:'DotGothic16',sans-serif; font-size:12px; color:var(--ink-soft);
  }
  .history-item .h-date{ font-size:13px; color:var(--ink); font-weight:700; }
  .history-empty{
    text-align:center; font-family:'DotGothic16',sans-serif; font-size:12px;
    color:var(--ink-soft); padding:12px;
  }

  .footer-row{ display:flex; justify-content:center; margin-top:22px; }
  .reset-link{
    font-family:'DotGothic16',sans-serif; font-size:12px; color:var(--ink-soft);
    text-decoration:underline; background:none; border:none; cursor:pointer; padding:8px;
  }

  .sync-note{
    text-align:center; font-family:'DotGothic16',sans-serif; font-size:11px;
    color:var(--ink-soft); margin-top:6px;
  }

  /* ---- modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(44,59,76,0.45);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:var(--paper-card); border:2px solid var(--ink); border-radius:6px;
    padding:20px; max-width:340px; width:100%;
    box-shadow:3px 3px 0 rgba(44,59,76,0.2);
  }
  .modal-box p{ font-size:14px; line-height:1.6; margin:0 0 16px; }
  .modal-btns{ display:flex; gap:10px; }
  .modal-btns .btn{ font-size:14px; padding:10px; }
  .btn-cancel{ background:var(--paper); color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">

  <div class="ticket">
    <div class="ticket-title">掲示板巡回<small>KEIJIBAN PATROL</small></div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-count" id="progressCount">0 / 23 完了</div>
    </div>
    <div class="progress-row" id="elapsedRow">
      <div class="progress-count" id="elapsedLabel">巡回開始前</div>
    </div>
    <div class="sync-note" id="syncNote">この端末に保存されます</div>
  </div>

  <div id="currentArea"></div>

  <div class="list-heading">巡回順一覧</div>
  <div class="list" id="list"></div>

  <div class="history-heading">巡回実施履歴</div>
  <div class="history-list" id="historyList"></div>

  <div class="footer-row">
    <button class="reset-link" id="resetBtn">この巡回をリセットする</button>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <p>すべての完了状況をリセットします。よろしいですか？</p>
    <div class="modal-btns">
      <button class="btn btn-cancel" id="modalCancel">キャンセル</button>
      <button class="btn btn-done" id="modalConfirm">リセットする</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'keijiban_patrol_progress';
  const TIMES_KEY = 'keijiban_patrol_times';
  const START_KEY = 'keijiban_patrol_start';
  const HISTORY_KEY = 'keijiban_patrol_history';

  const STOPS = [{"id": "13", "lat": 35.5289068, "lng": 139.4698987}, {"id": "14", "lat": 35.5282835, "lng": 139.4700986}, {"id": "15", "lat": 35.5281743, "lng": 139.470763}, {"id": "17", "lat": 35.5284414, "lng": 139.4712588}, {"id": "18", "lat": 35.5275164, "lng": 139.4719638}, {"id": "16", "lat": 35.5273216, "lng": 139.4733134}, {"id": "19", "lat": 35.5263711, "lng": 139.4730679}, {"id": "21", "lat": 35.5251718, "lng": 139.4724745}, {"id": "22", "lat": 35.5242648, "lng": 139.4718649}, {"id": "24", "lat": 35.5233862, "lng": 139.4730535}, {"id": "23", "lat": 35.5242768, "lng": 139.4729069}, {"id": "20", "lat": 35.5253363, "lng": 139.4736342}, {"id": "5", "lat": 35.5265158, "lng": 139.4759385}, {"id": "6", "lat": 35.52812, "lng": 139.4755059}, {"id": "4", "lat": 35.5290014, "lng": 139.4769695}, {"id": "7", "lat": 35.5297393, "lng": 139.4751677}, {"id": "8", "lat": 35.5302105, "lng": 139.4732936}, {"id": "9", "lat": 35.5295154, "lng": 139.4720616}, {"id": "10", "lat": 35.5300963, "lng": 139.4717806}, {"id": "12", "lat": 35.5307526, "lng": 139.4704875}, {"id": "11", "lat": 35.5310254, "lng": 139.4707986}, {"id": "2", "lat": 35.5308126, "lng": 139.4768376}, {"id": "1", "lat": 35.531497, "lng": 139.4768233}];

  let completedCount = 0; // 0〜STOPS.length
  let completedTimes = new Array(STOPS.length).fill(null); // 各地点の到着完了時刻(ms)
  let patrolStart = null; // 巡回開始時刻(ms)
  let patrolHistory = []; // 過去の巡回実施記録

  function loadProgress(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const n = raw !== null ? Number(raw) : 0;
      completedCount = (Number.isFinite(n) && n >= 0) ? n : 0;

      const rawTimes = localStorage.getItem(TIMES_KEY);
      const parsedTimes = rawTimes ? JSON.parse(rawTimes) : null;
      completedTimes = (Array.isArray(parsedTimes) && parsedTimes.length === STOPS.length)
        ? parsedTimes : new Array(STOPS.length).fill(null);

      const rawStart = localStorage.getItem(START_KEY);
      patrolStart = rawStart ? Number(rawStart) : null;

      const rawHistory = localStorage.getItem(HISTORY_KEY);
      const parsedHistory = rawHistory ? JSON.parse(rawHistory) : null;
      patrolHistory = Array.isArray(parsedHistory) ? parsedHistory : [];
    }catch(e){
      completedCount = 0;
      completedTimes = new Array(STOPS.length).fill(null);
      patrolStart = null;
      patrolHistory = [];
      document.getElementById('syncNote').textContent = 'この端末には保存できません（ブラウザの設定をご確認ください）';
    }
    render();
  }

  function persist(){
    try{
      localStorage.setItem(STORAGE_KEY, String(completedCount));
      localStorage.setItem(TIMES_KEY, JSON.stringify(completedTimes));
      localStorage.setItem(HISTORY_KEY, JSON.stringify(patrolHistory));
      if(patrolStart){
        localStorage.setItem(START_KEY, String(patrolStart));
      }else{
        localStorage.removeItem(START_KEY);
      }
    }catch(e){
      document.getElementById('syncNote').textContent = 'この端末には保存できません（ブラウザの設定をご確認ください）';
    }
  }

  function markPatrolStarted(){
    if(patrolStart === null){
      patrolStart = Date.now();
      persist();
    }
  }

  function completeCurrentStop(){
    const now = Date.now();
    if(patrolStart === null){
      // ナビ未タップのまま完了した場合の保険として、ここでも記録する
      patrolStart = now;
    }
    completedTimes[completedCount] = now;
    completedCount = completedCount + 1;

    if(completedCount >= STOPS.length){
      patrolHistory.unshift({
        date: new Date(patrolStart).toISOString().slice(0,10),
        mode: navMode,
        start: patrolStart,
        end: now,
        duration: now - patrolStart
      });
      if(patrolHistory.length > 30) patrolHistory = patrolHistory.slice(0, 30);
    }

    persist();
    render();
  }

  function resetProgress(){
    completedCount = 0;
    completedTimes = new Array(STOPS.length).fill(null);
    patrolStart = null;
    persist();
    render();
  }

  function mapsUrl(stop, mode){
    const travelmode = mode === 'walk' ? 'walking' : (mode === 'car' ? 'driving' : 'bicycling');
    return `https://www.google.com/maps/dir/?api=1&destination=${stop.lat},${stop.lng}&travelmode=${travelmode}`;
  }

  function formatClock(ts){
    const d = new Date(ts);
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    return `${hh}:${mm}`;
  }

  function formatElapsed(ms){
    if(ms < 0) ms = 0;
    const totalSec = Math.floor(ms/1000);
    const h = Math.floor(totalSec/3600);
    const m = Math.floor((totalSec%3600)/60);
    const s = totalSec%60;
    const mm = String(m).padStart(2,'0');
    const ss = String(s).padStart(2,'0');
    return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }

  function updateElapsedDisplay(){
    const label = document.getElementById('elapsedLabel');
    if(!label) return;
    if(patrolStart === null){
      label.textContent = '巡回開始前';
      return;
    }
    if(completedCount >= STOPS.length){
      const lastTime = completedTimes[STOPS.length - 1] || patrolStart;
      label.textContent = `開始 ${formatClock(patrolStart)} ／ 完了 ${formatClock(lastTime)}（所要 ${formatElapsed(lastTime - patrolStart)}）`;
    } else {
      label.textContent = `開始 ${formatClock(patrolStart)} ／ 経過 ${formatElapsed(Date.now() - patrolStart)}`;
    }
  }

  function modeLabel(mode){
    if(mode === 'walk') return '徒歩';
    if(mode === 'car') return '車';
    return '自転車';
  }

  let navMode = 'bike';

  function render(){
    const total = STOPS.length;
    document.getElementById('progressFill').style.width = (completedCount/total*100) + '%';
    document.getElementById('progressCount').textContent = `${completedCount} / ${total} 完了`;
    updateElapsedDisplay();

    const currentArea = document.getElementById('currentArea');
    if(completedCount >= total){
      currentArea.innerHTML = `
        <div class="current-card">
          <div class="all-done">
            <div class="stamp">巡回<br>完了</div>
            <p>本日の掲示板巡回はすべて完了しました</p>
          </div>
        </div>`;
    } else {
      const stop = STOPS[completedCount];
      currentArea.innerHTML = `
        <div class="current-card">
          <div class="current-label">
            <span>次の目的地</span>
            <span class="mode-toggle">
              <button class="mode-btn ${navMode==='bike'?'active':''}" data-mode="bike">自転車</button>
              <button class="mode-btn ${navMode==='walk'?'active':''}" data-mode="walk">徒歩</button>
              <button class="mode-btn ${navMode==='car'?'active':''}" data-mode="car">車</button>
            </span>
          </div>
          <div class="current-main">
            <div class="current-num">${completedCount+1}</div>
            <div>
              <div class="current-name">掲示板 No.${stop.id}</div>
              <div class="current-sub">全${total}箇所中 ${completedCount+1}番目</div>
            </div>
          </div>
          <div class="btn-row">
            <a class="btn btn-nav" href="${mapsUrl(stop, navMode)}" target="_blank" rel="noopener">Googleマップでナビ</a>
            <button class="btn btn-done" id="nextBtn">到着・完了</button>
          </div>
        </div>`;
      document.getElementById('nextBtn').addEventListener('click', () => {
        completeCurrentStop();
      });
      currentArea.querySelector('.btn-nav').addEventListener('click', () => {
        markPatrolStarted();
        updateElapsedDisplay();
      });
      currentArea.querySelectorAll('.mode-btn').forEach(b => {
        b.addEventListener('click', () => { navMode = b.dataset.mode; render(); });
      });
    }

    const listEl = document.getElementById('list');
    listEl.innerHTML = STOPS.map((stop, idx) => {
      const orderNum = idx + 1;
      const isDone = idx < completedCount;
      const isCurrent = idx === completedCount;
      const statusText = isCurrent ? '巡回中' : (isDone ? '' : '未訪問');
      const timeText = (isDone && completedTimes[idx]) ? `完了 ${formatClock(completedTimes[idx])}` : '';
      return `
        <div class="item ${isDone?'done':''} ${isCurrent?'current':''}" data-idx="${idx}">
          <div class="item-num">${orderNum}</div>
          <div class="item-body">
            <div class="item-name">掲示板 No.${stop.id}</div>
            ${statusText ? `<div class="item-status">${statusText}</div>` : ''}
          </div>
          ${timeText ? `<div class="item-time">${timeText}</div>` : ''}
        </div>`;
    }).join('');

    listEl.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', () => {
        const idx = Number(el.dataset.idx);
        const stop = STOPS[idx];
        markPatrolStarted();
        updateElapsedDisplay();
        window.open(mapsUrl(stop, navMode), '_blank');
      });
    });

    const historyEl = document.getElementById('historyList');
    if(patrolHistory.length === 0){
      historyEl.innerHTML = '<div class="history-empty">まだ実施記録がありません</div>';
    } else {
      historyEl.innerHTML = patrolHistory.map(rec => {
        return `
          <div class="history-item">
            <span class="h-date">${rec.date}（${modeLabel(rec.mode)}）</span>
            <span>${formatClock(rec.start)}〜${formatClock(rec.end)}　所要 ${formatElapsed(rec.duration)}</span>
          </div>`;
      }).join('');
    }
  }

  document.getElementById('resetBtn').addEventListener('click', () => {
    document.getElementById('modalOverlay').classList.add('show');
  });
  document.getElementById('modalCancel').addEventListener('click', () => {
    document.getElementById('modalOverlay').classList.remove('show');
  });
  document.getElementById('modalConfirm').addEventListener('click', () => {
    resetProgress();
    document.getElementById('modalOverlay').classList.remove('show');
  });

  loadProgress();
  setInterval(() => {
    if(patrolStart !== null && completedCount < STOPS.length){
      updateElapsedDisplay();
    }
  }, 1000);
</script>
</body>
</html>
